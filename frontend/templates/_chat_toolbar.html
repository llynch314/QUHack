{# Voice, camera and read-aloud buttons on top of the chat. Same markup is copied into
   frontend/test.html (the patient app, a static page); keep the two in step. Wired up by chat.js + voice.js. #}
<div class="chat-toolbar" role="group" aria-label="Chat options">
    <button type="button" class="btn" id="voiceToggle" aria-pressed="false" aria-label="Start voice chat"
            title="Talk out loud and hear replies. Headphones work best."><span class="live-dot" aria-hidden="true"></span><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>Voice chat</button>
    <button type="button" class="btn" id="camToggle" aria-pressed="false"
            title="Let the AI notice your facial expression. Nothing is saved unless you turn that on."><span class="live-dot" aria-hidden="true"></span><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5 21 7.5v9l-5-3z"/></svg>Camera</button>
    <button type="button" class="btn" id="speakToggle" aria-pressed="false"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>Read replies aloud</button>
</div>
<div class="chat-live card" id="chatLive" hidden>
    <div class="stack">
        <div class="voice-panel stack" id="voicePanel" hidden>
            <div class="voice-level" aria-hidden="true"><span id="voiceLevel"></span></div>
            <p id="voiceStatus" class="status" role="status"></p>
        </div>
        <p id="camStatus" class="status" role="status"></p>
    </div>
    <video id="webcam" autoplay playsinline muted hidden aria-label="Your camera preview"></video>
</div>
